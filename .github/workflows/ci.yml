name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Unit tests
        run: cargo test

      - name: Extension compiles to wasm
        run: cargo check --target wasm32-wasip1

      - name: Shipped queries and VS Code parser match the pinned grammar revision
        run: scripts/sync-grammar.sh --check

      - name: Script tests
        run: python3 -m unittest discover -s scripts

  language-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: lsp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lsp/package-lock.json

      - run: npm ci

      - run: npm test
