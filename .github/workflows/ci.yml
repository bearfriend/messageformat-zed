name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Unit tests
        run: cargo test

      - name: Extension compiles to wasm
        run: cargo check --target wasm32-wasip1

      - name: Shipped queries match the pinned grammar revision
        run: scripts/sync-grammar.sh --check
